<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480">
  <defs>
    <path id="spark" d="M0-12L3-3 12 0 3 3 0 12-3 3-12 0-3-3Z"/>
    <path id="heart" d="M0 9C-15-2-12-15-4-15-1-15 0-12 0-10 0-12 1-15 4-15 12-15 15-2 0 9Z"/>
    <polygon id="star" points="0,-11 3.2,-3.5 11,-3.5 4.8,1.6 7,9.5 0,5 -7,9.5 -4.8,1.6 -11,-3.5 -3.2,-3.5"/>
    <path id="plus" d="M-6 0H6M0-6V6" fill="none" stroke-width="2.2" stroke-linecap="round"/>
    <g id="flower">
      <circle cx="0" cy="-9" r="6"/>
      <circle cx="0" cy="-9" r="6" transform="rotate(72)"/>
      <circle cx="0" cy="-9" r="6" transform="rotate(144)"/>
      <circle cx="0" cy="-9" r="6" transform="rotate(216)"/>
      <circle cx="0" cy="-9" r="6" transform="rotate(288)"/>
      <circle cx="0" cy="0" r="4.5" fill="#fde68a"/>
    </g>
    <g id="bow">
      <path d="M0 0L-24-13V13Z"/>
      <path d="M0 0L24-13V13Z"/>
      <circle cx="0" cy="0" r="5.5" fill="#f472b6"/>
    </g>
  </defs>

  <!-- Sparkles -->
  <use href="#spark" fill="#f472b6" opacity=".45" transform="translate(50 56) scale(1.3)"/>
  <use href="#spark" fill="#f9a8d4" opacity=".8" transform="translate(370 40) scale(.8)"/>
  <use href="#spark" fill="#f472b6" opacity=".4" transform="translate(240 270)"/>
  <use href="#spark" fill="#f9a8d4" opacity=".8" transform="translate(420 250) scale(.7)"/>
  <use href="#spark" fill="#f9a8d4" opacity=".8" transform="translate(130 440) scale(.8)"/>

  <!-- Hearts -->
  <use href="#heart" fill="none" stroke="#f9a8d4" stroke-width="1.8" transform="translate(150 30) rotate(-12) scale(1.1)"/>
  <use href="#heart" fill="#f9a8d4" opacity=".7" transform="translate(430 120) rotate(14) scale(.9)"/>
  <use href="#heart" fill="none" stroke="#f9a8d4" stroke-width="1.8" transform="translate(140 300) rotate(10) scale(1.3)"/>
  <use href="#heart" fill="#f9a8d4" opacity=".7" transform="translate(330 310) scale(.7)"/>
  <use href="#heart" fill="#f472b6" opacity=".4" transform="translate(250 450) rotate(-10) scale(.8)"/>
  <use href="#heart" fill="#f9a8d4" opacity=".7" transform="translate(455 455) scale(.55)"/>

  <!-- Flowers -->
  <use href="#flower" fill="#f9a8d4" opacity=".75" transform="translate(260 70) scale(1.2)"/>
  <use href="#flower" fill="#f472b6" opacity=".4" transform="translate(60 250) scale(.9)"/>
  <use href="#flower" fill="#f9a8d4" opacity=".75" transform="translate(400 380) scale(1.1)"/>

  <!-- Stars -->
  <use href="#star" fill="#f9a8d4" opacity=".7" transform="translate(220 160) scale(.9)"/>
  <use href="#star" fill="#f472b6" opacity=".4" transform="translate(60 380) scale(.8)"/>

  <!-- Bow -->
  <use href="#bow" fill="#f9a8d4" opacity=".8" transform="translate(340 195) rotate(-8)"/>

  <!-- Plus signs -->
  <use href="#plus" stroke="#f9a8d4" transform="translate(310 120)"/>
  <use href="#plus" stroke="#f9a8d4" transform="translate(100 205)"/>
  <use href="#plus" stroke="#f9a8d4" transform="translate(200 350)"/>
  <use href="#plus" stroke="#f9a8d4" transform="translate(445 320)"/>

  <!-- Dotted squiggles -->
  <path d="M30 140C60 112 90 168 120 140S170 130 190 142" fill="none" stroke="#f9a8d4"
        stroke-width="2.4" stroke-linecap="round" stroke-dasharray="2 8"/>
  <path d="M170 400C200 372 230 428 260 400S310 392 330 404" fill="none" stroke="#f9a8d4"
        stroke-width="2.4" stroke-linecap="round" stroke-dasharray="2 8"/>

  <!-- Small dots -->
  <g fill="#f9a8d4" opacity=".8">
    <circle cx="110" cy="80" r="2.5"/>
    <circle cx="300" cy="20" r="2"/>
    <circle cx="20" cy="320" r="2.5"/>
    <circle cx="380" cy="150" r="2"/>
    <circle cx="190" cy="230" r="2.5"/>
    <circle cx="460" cy="200" r="2"/>
    <circle cx="290" cy="400" r="2"/>
    <circle cx="90" cy="460" r="2.5"/>
    <circle cx="470" cy="60" r="2"/>
  </g>
</svg>